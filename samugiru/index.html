<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>薩姆吉爾村散步</title>
<style>
  html,body{margin:0;height:100%;background:#141414;overflow:hidden;touch-action:none}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}
  #back{position:fixed;right:8px;top:8px;display:none;color:#eee;font:14px/1 system-ui,sans-serif;background:#000a;padding:10px 14px;border-radius:6px;text-decoration:none}
  #hud{position:fixed;left:8px;top:8px;color:#ddd;font:12px/1.5 system-ui,sans-serif;background:#0008;padding:4px 8px;border-radius:4px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a id="back" href="../">← 回樓梯</a>
<div id="hud">點地面走過去／方向鍵、WASD｜H 顯示碰撞｜+ − 縮放｜M 音樂</div>
<audio id="bgm" src="bgm.wav" loop></audio>
<script src="data.js"></script>
<script>
// 石器時代薩姆吉爾村（floor 1000）重現。資料由 地圖/tools/samugiru_walk_bake.py 烘焙；
// 樓梯間（publish-stairwell.js）把整個資料夾打包成終點那扇門後面的 samugiru/，從那裡進來會帶 ?from=stair。
if (new URLSearchParams(location.search).get('from') === 'stair') document.getElementById('back').style.display = 'block';
const D = window.SAMU, W = D.W, H = D.H;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const load = fn => { const im = new Image(); im.src = fn; return im; };
const chunks = D.chunks.map(([fn, x, y]) => ({ im: load(fn), x, y }));
const osheets = D.osheets.map(load), csheets = D.csheets.map(load);
const walkable = (x, y) => x >= 0 && y >= 0 && x < W && y < H && D.walk[y * W + x] === '1';
// 投影照客戶端 map.cpp：+x 往右上、+y 往右下
const scr = (x, y) => [(x + y) * 32 + D.M, (y - x) * 24 + W * 24 + D.M];

// 物件：依錨點螢幕 y 由上到下畫
const objs = D.placed.map(([x, y, s]) => {
  const sp = D.sprites[s], [sx, sy] = scr(x, y);
  return { x, y, sp, l: sx + sp[5], t: sy + sp[6], r: sx + sp[5] + sp[3], b: sy + sp[6] + sp[4], d: sy };
}).sort((a, b) => a.d - b.d || a.l - b.l);

// 物件會不會蓋住站在 (cx,cy) 的角色：錨點是佔地前角，角色在前角的後方象限就被蓋
function inFront(o, cx, cy) {
  const hit = o.sp[9], prio = o.sp[10];
  if (hit !== 0 && prio === 3) return false;
  if (hit !== 0 && cx === o.x && cy === o.y) return false; // 可走的地被，站上去在上面
  return cx >= o.x && cy <= o.y;
}

// ---- 角色 ----
const pc = { x: D.start[0], y: D.start[1], fx: D.start[0], fy: D.start[1], t: 1, dir: 0, path: [], anim: 0 };
const STEP_MS = 260;
// 方向 0 面向鏡頭，畫面順時針：0 下 1 左下 2 左 3 左上 4 上 5 右上 6 右 7 右下
function dirOf(dx, dy) {
  const vx = (dx + dy) * 32, vy = (dy - dx) * 24;
  const a = Math.atan2(vx, vy); // 從「下」起算、往左為正
  return ((Math.round(-a / (Math.PI / 4)) % 8) + 8) % 8;
}
// 8 方向尋路，斜走不切角
function findPath(sx, sy, tx, ty) {
  if (!walkable(tx, ty)) {
    let best = null, bd = 1e9;
    for (let r = 1; r < 6 && !best; r++) for (let yy = ty - r; yy <= ty + r; yy++) for (let xx = tx - r; xx <= tx + r; xx++)
      if (walkable(xx, yy)) { const d = (xx - tx) ** 2 + (yy - ty) ** 2; if (d < bd) { bd = d; best = [xx, yy]; } }
    if (!best) return [];
    [tx, ty] = best;
  }
  const prev = new Int32Array(W * H).fill(-1), q = [sy * W + sx]; prev[sy * W + sx] = sy * W + sx;
  for (let qi = 0; qi < q.length; qi++) {
    const c = q[qi], cx = c % W, cy = (c / W) | 0;
    if (cx === tx && cy === ty) break;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = cx + dx, ny = cy + dy;
      if (!walkable(nx, ny) || prev[ny * W + nx] >= 0) continue;
      if (dx && dy && (!walkable(cx + dx, cy) || !walkable(cx, cy + dy))) continue;
      prev[ny * W + nx] = c; q.push(ny * W + nx);
    }
  }
  if (prev[ty * W + tx] < 0) return [];
  const out = []; let c = ty * W + tx;
  while (c !== sy * W + sx) { out.push([c % W, (c / W) | 0]); c = prev[c]; }
  return out.reverse();
}
function nextStep() {
  let step = null;
  const k = keyDir();
  if (k) { pc.path = []; const [dx, dy] = k; const nx = pc.x + dx, ny = pc.y + dy;
    pc.dir = dirOf(dx, dy);
    if (walkable(nx, ny) && !(dx && dy && (!walkable(pc.x + dx, pc.y) || !walkable(pc.x, pc.y + dy)))) step = [nx, ny];
  } else if (pc.path.length) step = pc.path.shift();
  if (!step) return false;
  pc.dir = dirOf(step[0] - pc.x, step[1] - pc.y);
  pc.fx = pc.x; pc.fy = pc.y; pc.x = step[0]; pc.y = step[1]; pc.t = 0;
  return true;
}

// ---- 輸入 ----
const keys = new Set();
addEventListener('keydown', e => {
  keys.add(e.key.toLowerCase()); startBgm();
  if (e.key === 'h' || e.key === 'H') showHit = !showHit;
  if (e.key === '+' || e.key === '=') zoom = Math.min(4, zoom + 0.5);
  if (e.key === '-') zoom = Math.max(0.5, zoom - 0.5);
  if (e.key === 'm' || e.key === 'M') { bgm.paused ? bgm.play() : bgm.pause(); }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
// 畫面方向鍵 → 格子方向：上＝(+1,−1)、右＝(+1,+1)
function keyDir() {
  let sx = 0, sy = 0;
  if (keys.has('arrowup') || keys.has('w')) sy--;
  if (keys.has('arrowdown') || keys.has('s')) sy++;
  if (keys.has('arrowleft') || keys.has('a')) sx--;
  if (keys.has('arrowright') || keys.has('d')) sx++;
  if (!sx && !sy) return null;
  // 畫面右 = (+1,+1)、畫面上 = (+1,−1)
  let dx = sx - sy, dy = sx + sy;
  return [Math.sign(dx), Math.sign(dy)];
}
let pointerDown = false, lastPointer = null;
function screenToTile(px, py) {
  const [cx, cy] = cam();
  const wx = (px - cv.clientWidth / 2) / zoom + cx, wy = (py - cv.clientHeight / 2) / zoom + cy;
  const a = (wx - D.M) / 32, b = (wy - D.M - W * 24) / 24; // a = x+y, b = y−x
  return [Math.round((a - b) / 2), Math.round((a + b) / 2)];
}
function goTo(px, py) { const [tx, ty] = screenToTile(px, py); pc.path = findPath(pc.x, pc.y, tx, ty); target = [tx, ty]; }
cv.addEventListener('pointerdown', e => { pointerDown = true; lastPointer = [e.clientX, e.clientY]; goTo(e.clientX, e.clientY); startBgm(); });
cv.addEventListener('pointermove', e => { if (pointerDown) lastPointer = [e.clientX, e.clientY]; });
addEventListener('pointerup', () => { pointerDown = false; });
let holdTimer = 0, target = null;

// ---- BGM ----
const bgm = document.getElementById('bgm'); bgm.volume = 0.5;
let bgmStarted = false;
function startBgm() { if (!bgmStarted) { bgmStarted = true; bgm.play().catch(() => { bgmStarted = false; }); } }

// ---- 畫面 ----
let zoom = 1, showHit = false;
function resize() {
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  zoom = Math.max(1, Math.round(Math.min(innerWidth / 800, innerHeight / 600)));
}
addEventListener('resize', resize); resize();
function pcPos() {
  const t = Math.min(1, pc.t), [ax, ay] = scr(pc.fx, pc.fy), [bx, by] = scr(pc.x, pc.y);
  return [ax + (bx - ax) * t, ay + (by - ay) * t];
}
function cam() { return pcPos(); }
function drawSprite(sheets, sp, x, y) {
  ctx.drawImage(sheets[sp[0]], sp[1], sp[2], sp[3], sp[4], Math.round(x + sp[5]), Math.round(y + sp[6]), sp[3], sp[4]);
}
let last = performance.now();
function frame(now) {
  const dt = Math.max(0, Math.min(100, now - last)); last = now;
  // 長按拖曳：每 200ms 重新尋路
  if (pointerDown && lastPointer && (holdTimer += dt) > 200) { holdTimer = 0; goTo(...lastPointer); }
  if (pc.t < 1) pc.t += dt / STEP_MS;
  if (pc.t >= 1) { pc.t = 1; if (nextStep()) pc.t = Math.max(0, pc.t); }
  const moving = pc.t < 1;
  pc.anim += dt;

  const dpr = devicePixelRatio || 1, vw = cv.clientWidth, vh = cv.clientHeight;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#141414'; ctx.fillRect(0, 0, cv.width, cv.height);
  const [cx, cy] = cam(), s = zoom * dpr;
  ctx.setTransform(s, 0, 0, s, Math.round(vw / 2 * dpr - cx * s), Math.round(vh / 2 * dpr - cy * s));
  ctx.imageSmoothingEnabled = false;
  const L = cx - vw / 2 / zoom - 8, T = cy - vh / 2 / zoom - 8, R = cx + vw / 2 / zoom + 8, B = cy + vh / 2 / zoom + 8;
  for (const c of chunks) if (c.x < R && c.x + D.CH > L && c.y < B && c.y + D.CH > T && c.im.complete) ctx.drawImage(c.im, c.x, c.y);

  if (showHit) {
    ctx.fillStyle = 'rgba(255,40,40,.35)';
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (!walkable(x, y)) {
      const [sx, sy] = scr(x, y); if (sx < L - 32 || sx > R + 32 || sy < T - 24 || sy > B + 24) continue;
      ctx.beginPath(); ctx.moveTo(sx, sy - 24); ctx.lineTo(sx + 32, sy); ctx.lineTo(sx, sy + 24); ctx.lineTo(sx - 32, sy); ctx.fill();
    }
  }
  if (target && pc.path.length) {
    const [sx, sy] = scr(...target); ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx, sy - 12); ctx.lineTo(sx + 16, sy); ctx.lineTo(sx, sy + 12); ctx.lineTo(sx - 16, sy); ctx.closePath(); ctx.stroke();
  }

  // 角色用比較靠前（螢幕下方）的那一格判斷遮擋
  const [px, py] = pcPos();
  const useTo = scr(pc.x, pc.y)[1] >= scr(pc.fx, pc.fy)[1];
  const ox = useTo ? pc.x : pc.fx, oy = useTo ? pc.y : pc.fy;
  const act = D.acts[moving ? 'walk' : 'stand'][pc.dir];
  const fi = ((Math.floor(pc.anim / (act.ms / act.f.length)) % act.f.length) + act.f.length) % act.f.length || 0;
  const fsp = act.f[fi];
  const cl = px + fsp[5], ct = py + fsp[6], cr = cl + fsp[3], cb = ct + fsp[4];
  const front = [];
  for (const o of objs) {
    if (o.r < L || o.l > R || o.b < T || o.t > B) continue;
    drawSprite(osheets, o.sp, ...scr(o.x, o.y));
    if (o.r > cl && o.l < cr && o.b > ct && o.t < cb && inFront(o, ox, oy)) front.push(o);
  }
  drawSprite(csheets, fsp, px, py);
  for (const o of front) drawSprite(osheets, o.sp, ...scr(o.x, o.y));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
